}
function drawStreetLamp(x,baseY,night,seed){
  ctx.strokeStyle='#0a0d12';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,baseY);ctx.lineTo(x,baseY-110);ctx.quadraticCurveTo(x,baseY-122,x+22,baseY-122);ctx.stroke();
  ctx.fillStyle='#0a0d12';ctx.fillRect(x+18,baseY-126,12,6);
  ctx.save();if(Q.glow){ctx.shadowColor='#ffd98a';ctx.shadowBlur=18;}ctx.fillStyle=night?'#ffe6a0':'#fff3cc';ctx.beginPath();ctx.arc(x+24,baseY-120,3.4,0,7);ctx.fill();ctx.restore();
  if(night&&Q.glow){const g=ctx.createRadialGradient(x+24,baseY-120,0,x+24,baseY-120,70);g.addColorStop(0,'rgba(255,220,140,.18)');g.addColorStop(1,'rgba(255,220,140,0)');ctx.fillStyle=g;ctx.fillRect(x-46,baseY-180,140,180);}
}
function drawSpeedLines(){if(!Q.speedlines||!(run&&run.nitroActive))return;const sp=Math.abs(bike.vx);const a=Math.min(.22,sp/60);
  ctx.strokeStyle='rgba(180,235,255,'+a+')';ctx.lineWidth=2;
  for(let i=0;i<5;i++){const y=(i*150+now0*0.5)%H;const len=50+Math.random()*40;const xx=W-((now0*sp*0.35+i*220)%(W*1.5));ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx+len,y);ctx.stroke();}}
function drawPopups(){for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.y-=0.7;p.life--;if(p.life<=0){popups.splice(i,1);continue;}
  const a=Math.min(1,p.life/20);ctx.globalAlpha=a;ctx.font='700 34px Oswald,sans-serif';ctx.textAlign='center';
  ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1;}}

/* ============================ BIKE ART (comic Sur-Ron) ============================ */
function dl(g,x1,y1,x2,y2,wdt,col){g.strokeStyle=col;g.lineWidth=wdt;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function roundRectP(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');let n=parseInt(c,16);let r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}
function drawWheel(g,x,y,col,spin){
  g.save();g.translate(x,y);
  g.beginPath();g.arc(0,0,R,0,7);g.fillStyle=col.tire;g.fill();g.lineWidth=2.6;g.strokeStyle='#05080c';g.stroke();
  g.strokeStyle='#05080c';g.lineWidth=2.2;for(let a=0;a<14;a++){const an=a/14*6.283+spin;g.beginPath();g.moveTo(Math.cos(an)*(R-1),Math.sin(an)*(R-1));g.lineTo(Math.cos(an)*(R+1.6),Math.sin(an)*(R+1.6));g.stroke();}
  g.beginPath();g.arc(0,0,R-6,0,7);g.fillStyle=col.rim;g.fill();g.lineWidth=2;g.strokeStyle='#05080c';g.stroke();
  g.strokeStyle=col.spoke;g.lineWidth=1.3;g.globalAlpha=.95;
  for(let a=0;a<9;a++){const an=a/9*6.283+spin*0.6;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(an)*(R-6),Math.sin(an)*(R-6));g.stroke();}
  g.globalAlpha=1;
  g.beginPath();g.arc(0,0,R-9,0,7);g.fillStyle=col.disc;g.globalAlpha=.5;g.fill();g.globalAlpha=1;
  g.beginPath();g.arc(0,0,3.4,0,7);g.fillStyle='#0a0d12';g.fill();g.lineWidth=1.2;g.strokeStyle=col.acc2||col.acc;g.stroke();
  g.restore();
}
function drawShock(g,x1,y1,x2,y2,comp,col){
  const dx=x2-x1,dy=y2-y1;const len=Math.hypot(dx,dy);const ang=Math.atan2(dy,dx);
  g.save();g.translate(x1,y1);g.rotate(ang);
  const L=Math.max(6,len-comp*0.55);
  g.strokeStyle='#2b2b2b';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.lineTo(L,0);g.stroke();
  g.strokeStyle=col;g.lineWidth=2.2;const n=6;g.beginPath();g.moveTo(0,0);
  for(let i=1;i<=n;i++){const t=i/n;g.lineTo(t*L,(i%2?1:-1)*2.5);}g.stroke();
  g.restore();
}
function drawBikeArt(g,b,comp){
  comp=comp||0;
  const c=b.def.col,style=b.def.style;const OL='#05080c';
  const rAxY=AX-comp, fAxY=AX-comp;
  // ---- UNGEFEDERT: Räder + Frontfender ----
  drawWheel(g,-WB/2,AX,c,b.wheelSpin);
  drawWheel(g,WB/2,AX,c,b.wheelSpin);
  if(c.mxFender){ // hoher, gekrümmter MX-Frontfender
    g.fillStyle=c.fender||c.plastic;g.strokeStyle=OL;g.lineWidth=2;
    g.beginPath();g.moveTo(16,-3);g.quadraticCurveTo(36,-13,52,-5);g.lineTo(50,-1);g.quadraticCurveTo(36,-9,16,2);g.closePath();g.fill();g.stroke();
  }else{
    g.fillStyle=c.fender||c.plastic;g.strokeStyle=OL;g.lineWidth=2;
    g.beginPath();g.moveTo(WB/2-8,8);g.quadraticCurveTo(WB/2,2,WB/2+10,8);g.lineTo(WB/2+8,11);g.quadraticCurveTo(WB/2,6,WB/2-7,11);g.closePath();g.fill();g.stroke();
  }
  g.fillStyle='#11151a';roundRectP(g,WB/2-10,AX-4,5,9,2);g.fill();g.strokeStyle=OL;g.lineWidth=1.1;g.stroke(); // Bremssattel vorne
  // ---- GEFEDERTE MASSE (squattet bei comp) ----
  g.save();g.translate(0,comp);
  dl(g,-12,9,-WB/2,rAxY,5,shade(c.frame,12));
  if(style==='lightbee'){g.setLineDash([3,3]);dl(g,-12,12,-WB/2,rAxY,2,c.acc2||'#e9b23a');g.setLineDash([]);}
  drawShock(g,-6,-9,-18,7,comp,'#caa23a');
  if(style==='enduro'){
    g.fillStyle=c.plastic;g.strokeStyle=OL;g.lineWidth=2.4;
    g.beginPath();g.moveTo(-32,-12);g.lineTo(-6,-16);g.lineTo(2,-2);g.lineTo(-30,-2);g.closePath();g.fill();g.stroke();
    g.fillStyle=shade(c.plastic,-8);
    g.beginPath();g.moveTo(-2,-14);g.lineTo(20,-12);g.lineTo(22,8);g.lineTo(-6,12);g.closePath();g.fill();g.stroke();
    g.fillStyle=c.acc2;g.beginPath();g.moveTo(2,-12);g.lineTo(10,-12);g.lineTo(4,10);g.lineTo(-4,10);g.closePath();g.fill();
    // Lightning-Zacken in Akzentfarbe
    g.strokeStyle=c.acc;g.lineWidth=2;g.beginPath();g.moveTo(-26,-8);g.lineTo(-20,-5);g.lineTo(-24,-2);g.lineTo(-18,2);g.stroke();
    g.fillStyle=c.acc;g.fillRect(-1,-6,3,12);
    if(c.ring){ // Sunset-Ring-Logo
      g.save();g.lineWidth=3;
      g.strokeStyle='#ffb33a';g.beginPath();g.arc(10,0,5.5,0,7);g.stroke();
