function drawBgTraffic(night){if(!Q.bgtraffic)return;const baseY=H*cam.anchorY-2;const par=0.5;const span=W+220;
  for(let i=0;i<5;i++){const sp=(0.4+hash(i*3.1)*0.6);let x=((now0*0.04*sp+i*270-cam.x*par)%span+span)%span-110;const w=24+hash(i)*9;
    ctx.fillStyle=night?'#0c1426':'#3a2a44';roundRectP(ctx,x,baseY-10,w,8,3);ctx.fill();
