    for(let b=0;b<4;b++){const bx=x+b*s*0.5-s*0.6;const by=y+(b%2?6:0);const r=s*(0.5-Math.abs(b-1.5)*0.08);ctx.beginPath();ctx.ellipse(bx,by,r,r*0.6,0,0,7);ctx.fill();}
