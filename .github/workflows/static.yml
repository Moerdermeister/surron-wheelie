function drawStreet(night){
  const left=cam.x-W/cam.zoom-40,right=cam.x+W/cam.zoom+40;
  ctx.beginPath();ctx.moveTo(left,cam.y+H/cam.zoom+200);
  for(let x=left;x<=right;x+=6)ctx.lineTo(x,groundY(x));
  ctx.lineTo(right,cam.y+H/cam.zoom+200);ctx.closePath();
  const gg=ctx.createLinearGradient(0,STREET_Y-90,0,STREET_Y+300);
  if(night){gg.addColorStop(0,'#1a1f2a');gg.addColorStop(.5,'#10131a');gg.addColorStop(1,'#070a0f');}
  else{gg.addColorStop(0,'#3a3340');gg.addColorStop(.5,'#26222c');gg.addColorStop(1,'#15121a');}
  ctx.fillStyle=gg;ctx.fill();
  ctx.lineWidth=4;ctx.strokeStyle=night?'#2a3340':'#54485a';
  ctx.beginPath();for(let x=left;x<=right;x+=6){const y=groundY(x);if(x===left)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
  ctx.lineWidth=1.6;ctx.strokeStyle=night?'#3a4656':'#7a6a82';
  ctx.beginPath();for(let x=left;x<=right;x+=6){const y=groundY(x)-3;if(x===left)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
  if(Q.refl){ctx.save();ctx.globalAlpha=night?0.16:0.10;const cols=['#ff4d9a','#2ee6d6','#9eff00','#ffce4d'];
    for(let x=Math.floor(left/120)*120;x<=right;x+=120){ctx.fillStyle=cols[Math.floor(hash(x)*4)];const gy=groundY(x);ctx.fillRect(x,gy+12,3,60);}ctx.restore();}
  ctx.fillStyle=night?'rgba(230,200,90,.55)':'rgba(255,210,90,.7)';
  for(let x=Math.floor(left/64)*64;x<=right;x+=64){const gy=groundY(x);ctx.fillRect(x,gy+40,30,5);}
  ctx.fillStyle='rgba(0,0,0,.3)';for(let x=Math.floor(left/420)*420;x<=right;x+=420){const gy=groundY(x);ctx.beginPath();ctx.ellipse(x+60,gy+58,12,4,0,0,7);ctx.fill();}
}
function drawPickups(){
