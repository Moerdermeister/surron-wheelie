function blendP(a,c,e){return {x:lerp(a.x,c.x,e),y:lerp(a.y,c.y,e)};}
function drawRider(g,b){
  const standing=keys.stand&&!b.crashed;const air=!b.onGround;const back=keys.leanBack,fwd=keys.leanFwd;
  let hip,head,foot1,foot2,hand={x:18,y:-26};
  if(air&&Math.abs(b.rotAccum)>0.6){hip={x:-2,y:-30};head={x:8,y:-40};foot1={x:-16,y:-24};foot2={x:-13,y:-20};
    if(b.airStartStand){hip={x:-6,y:-32};head={x:14,y:-34};foot1={x:-30,y:-30};foot2={x:-27,y:-24};hand={x:24,y:-30};}}
  else if(standing){hip={x:0,y:-34};head={x:8,y:-50};foot1={x:-2,y:6};foot2={x:-6,y:6};
    if(air){hip={x:3,y:-36};head={x:14,y:-48};foot1={x:-8,y:-6};foot2={x:-15,y:-2};}
    if(b.noHand>0.5)hand={x:14,y:-40};}
  else if(back){hip={x:-12,y:-24};head={x:-4,y:-40};foot1={x:-2,y:6};foot2={x:-6,y:6};}
  else if(fwd){hip={x:-6,y:-22};head={x:14,y:-34};foot1={x:-1,y:6};foot2={x:-5,y:6};}
  else{hip={x:-10,y:-22};head={x:2,y:-38};foot1={x:-1,y:6};foot2={x:-5,y:6};}
  // Trick weich ein-/ausblenden (perfekte Übergänge)
  if(b.trick&&b.trick.pose){const tk=b.trick;const Pp=tk.pose(tk.t);
    const e=clamp(Math.min(tk.t/11,(tk.dur-tk.t)/11,1),0,1);
    hip=blendP(hip,Pp.hip,e);head=blendP(head,Pp.head,e);foot1=blendP(foot1,Pp.foot1,e);foot2=blendP(foot2,Pp.foot2,e);hand=blendP(hand,Pp.hand,e);}
  const acc=b.def.col.acc;const OL='#0a0e13';g.lineCap='round';
  g.strokeStyle='#16191f';g.lineWidth=5;
  dl(g,hip.x,hip.y,(hip.x+foot1.x)/2-1,(hip.y+foot1.y)/2,5,'#16191f');dl(g,(hip.x+foot1.x)/2-1,(hip.y+foot1.y)/2,foot1.x,foot1.y,5,'#16191f');
  g.strokeStyle='#1e232b';dl(g,hip.x,hip.y,(hip.x+foot2.x)/2,(hip.y+foot2.y)/2,5,'#1e232b');dl(g,(hip.x+foot2.x)/2,(hip.y+foot2.y)/2,foot2.x,foot2.y,5,'#1e232b');
  g.fillStyle=acc;g.fillRect(foot1.x-3,foot1.y-1,6,3);
  g.strokeStyle='#262d37';g.lineWidth=7;dl(g,hip.x,hip.y,head.x,head.y+5,7,'#262d37');
  dl(g,hip.x,hip.y,head.x,head.y+5,2.4,acc);
  const sh={x:hip.x*0.3+head.x*0.7,y:hip.y*0.3+head.y*0.7};
  g.strokeStyle='#262d37';g.lineWidth=4.4;
  dl(g,sh.x,sh.y,(sh.x+hand.x)/2,(sh.y+hand.y)/2-2,4.4,'#262d37');dl(g,(sh.x+hand.x)/2,(sh.y+hand.y)/2-2,hand.x,hand.y,4.4,'#262d37');
  g.fillStyle='#eef4f8';g.strokeStyle=OL;g.lineWidth=1.6;g.beginPath();g.arc(head.x,head.y,6,0,7);g.fill();g.stroke();
  g.fillStyle=acc;g.beginPath();g.arc(head.x,head.y,6,-2.3,0.4);g.fill();
  g.fillStyle='#0c0f14';g.beginPath();g.ellipse(head.x+3.5,head.y+1,2.6,2.2,0,0,7);g.fill();
  g.fillStyle='#0c0f14';g.beginPath();g.moveTo(head.x-6,head.y+1);g.lineTo(head.x-8,head.y+3);g.lineTo(head.x-5,head.y+3);g.closePath();g.fill();
}
function drawBikeWorld(b,rx,ry,rt,rsus){
  rx=rx==null?b.cx:rx; ry=ry==null?b.cy:ry; rt=rt==null?b.tilt:rt; rsus=rsus==null?b.sus:rsus;
  ctx.save();ctx.translate(rx,ry);
  const gh=groundY(rx)-ry;const sc=clamp(1-gh/300,0.2,1);
  if(Q.shadow){ctx.save();ctx.globalAlpha=.32*sc;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,(groundY(rx)-ry)+2,WB*0.8*sc,7*sc,0,0,7);ctx.fill();ctx.restore();}
  ctx.rotate(-rt);
  const comp=clamp(rsus||0,-3,13)*0.55;
  drawBikeArt(ctx,b,comp);
  ctx.save();ctx.translate(0,comp);drawRider(ctx,b);ctx.restore();
  ctx.restore();
}

/* ============================ HUD / LOOP ============================ */
function renderHeat(){const wrap=el('heatStars');let s='';for(let i=0;i<5;i++)s+='<svg class="star '+(i<(run?run.heat:0)?'lit':'')+'" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3L22 9l-5 4.6L18.4 21 12 17.4 5.6 21 7 13.6 2 9l7.1-.7z"/></svg>';wrap.innerHTML=s;}
function renderMission(){if(!run||!run.mission)return;const m=run.mission;el('missionT').textContent=m.def.t;
  el('missionP').textContent=m.done?'✓ Erledigt':Math.min(m.prog|0,m.def.goal)+' / '+m.def.goal+'  ·  +'+m.def.rew;}
const comboBox=el('combo'),balanceWrap=el('balanceWrap'),balanceFill=el('balanceFill'),nitroFill=el('nitroFill');
el('balanceZone').style.left='62%';el('balanceZone').style.width='26%';
function syncHud(){
  el('hudCoins').textContent=Math.floor(save.coins+(run?run.coins:0));
  el('hudScore').textContent=Math.floor(run?run.score:0);
  el('hudSpeed').textContent=Math.round(Math.abs(bike?bike.vx:0)*6.2);
  el('hudDist').textContent=Math.floor(run?run.dist:0)+' m';
  nitroFill.style.width=(run?run.nitro:0)+'%';
  if(run&&run.comboTimer>0){run.comboTimer--;comboBox.classList.add('show');el('comboMult').textContent=run.combo>1?'x'+run.combo:'';el('comboLbl').textContent=run.comboLabel;}
  else comboBox.classList.remove('show');
  if(bike&&bike.rearDown&&!bike.frontDown&&bike.tilt>0.3){balanceWrap.classList.add('show');balanceFill.style.left=clamp(bike.tilt/LOOP_LIMIT,0,1)*100+'%';}
  else balanceWrap.classList.remove('show');
}
let last=0,acc=0;const DT=1000/60;
function frame(now){
  requestAnimationFrame(frame);
  if(state!==ST.PLAY)return;
  acc+=Math.min(100,now-last);last=now;let n=0;
  while(acc>=DT&&n<5){
    spawnAhead();step();
    if(state!==ST.PLAY)break;
    updatePolice();
    if(state!==ST.PLAY)break;
    if(!bike.crashed){
      run.dist=Math.max(run.dist,(bike.cx-run.startX)/12);
      run.score+=Math.abs(bike.vx)*0.02;run.coins+=Math.abs(bike.vx)*0.004;
      if(run.mission.def.type==='dist'){run.mission.prog=run.dist;if(run.dist>=run.mission.def.goal&&!run.mission.done)completeMission();}
      if(run.mode==='police'&&Math.abs(bike.vx)>bike.p.top*0.85)run.heatTimer+=0.4;
    }
    acc-=DT;n++;
  }
  const alpha=clamp(acc/DT,0,1);
  render(now,alpha);syncHud();audioUpdate(bike);renderMission();
}
requestAnimationFrame(frame);

function endRun(crashed){
  if(state!==ST.PLAY)return;state=ST.OVER;
  save.coins=Math.floor(save.coins+run.coins);
  const fs=Math.floor(run.score);if(fs>save.best)save.best=fs;persist();
  const busted=run.bustReason==='BUSTED';
  el('overTag').textContent=busted?'Verhaftet':(crashed?'Gecrasht':'Run beendet');
  el('overTitle').textContent=busted?'BUSTED':'RUN ENDE';
  el('oScore').textContent=fs;el('oDist').textContent=Math.floor(run.dist)+' m';el('oCoins').textContent='+'+Math.floor(run.coins);el('oTricks').textContent=run.tricks;
  el('hud').classList.add('hide');el('touch').classList.remove('on');showScreen('scrOver');
}

