const CARCOLS=[['#d23b3b','#a02020'],['#2e7be6','#1b4fa0'],['#e6b52e','#b08410'],['#e6e6ec','#a8a8b4']];
function drawObstacles(night){
  for(const o of obstacles){
    if(o.hit&&o.type==='cone')continue;
    const gy=groundY(o.x);
    if(o.type==='car'){
      const c=CARCOLS[o.car%4];const x=o.x,w=o.w,y=gy-o.h;
      if(Q.shadow){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,gy+3,w*0.55,5,0,0,7);ctx.fill();}
      ctx.lineJoin='round';ctx.strokeStyle='#0a0d12';ctx.lineWidth=2.5;
      ctx.fillStyle=c[0];roundRectP(ctx,x-w/2,y-6,w,o.h+6,6);ctx.fill();ctx.stroke();
      ctx.fillStyle=c[1];roundRectP(ctx,x-w*0.28,y-20,w*0.56,18,6);ctx.fill();ctx.stroke();
      ctx.fillStyle='#bfe6ff';roundRectP(ctx,x-w*0.22,y-17,w*0.5,12,4);ctx.fill();
      ctx.fillStyle='#11151a';ctx.beginPath();ctx.arc(x-w*0.28,gy,8,0,7);ctx.arc(x+w*0.28,gy,8,0,7);ctx.fill();
      ctx.fillStyle=night?'#ff5a5a':'#ffd24d';ctx.fillRect(x+w/2-3,y-2,4,5);
      if(night){ctx.fillStyle='#ff5a5a';ctx.fillRect(x-w/2-1,y-2,4,5);}
    }else if(o.type==='dumpster'){
      const x=o.x,w=o.w,y=gy-o.h;
      if(Q.shadow){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,gy+3,w*0.6,5,0,0,7);ctx.fill();}
      ctx.strokeStyle='#0a0d12';ctx.lineWidth=2.5;ctx.fillStyle='#2f7d3a';
      ctx.beginPath();ctx.moveTo(x-w/2,gy);ctx.lineTo(x-w/2+6,y);ctx.lineTo(x+w/2-6,y);ctx.lineTo(x+w/2,gy);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle='#3a9648';ctx.fillRect(x-w/2,y-5,w,7);ctx.strokeRect(x-w/2,y-5,w,7);
    }else if(o.type==='cone'){
      const x=o.x,y=gy;ctx.fillStyle='#ff7a2b';ctx.beginPath();ctx.moveTo(x,y-o.h);ctx.lineTo(x-8,y);ctx.lineTo(x+8,y);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.fillRect(x-6,y-9,12,3);
    }else if(o.type==='roadblock'){
      const x=o.x,w=o.w,y=gy-o.h;
      if(Q.shadow){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,gy+3,w*0.6,5,0,0,7);ctx.fill();}
      ctx.strokeStyle='#0a0d12';ctx.lineWidth=2.5;
      // Böcke
      ctx.strokeStyle='#caa23a';ctx.lineWidth=3;dl(ctx,x-w/2+6,y+o.h,x-w/2+14,y+8,3,'#caa23a');dl(ctx,x+w/2-6,y+o.h,x+w/2-14,y+8,3,'#caa23a');
      // gestreifte Tafel
      ctx.save();for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#ff3a2b':'#f2f4f7';ctx.fillRect(x-w/2+i*(w/6),y,w/6,16);}ctx.restore();
      ctx.strokeStyle='#0a0d12';ctx.lineWidth=2;ctx.strokeRect(x-w/2,y,w,16);
      // Blaulicht
      ctx.fillStyle=(Math.floor(now0*0.01)%2)?'#2ea6ff':'#ff3a4a';ctx.beginPath();ctx.arc(x,y-4,3,0,7);ctx.fill();
    }else if(o.type==='spikestrip'){
      const x=o.x,w=o.w;ctx.fillStyle='#1b1f25';roundRectP(ctx,x-w/2,gy-5,w,6,2);ctx.fill();
      ctx.fillStyle='#cfd6dd';for(let sx=x-w/2+4;sx<x+w/2;sx+=7){ctx.beginPath();ctx.moveTo(sx,gy-5);ctx.lineTo(sx+3,gy-12);ctx.lineTo(sx+6,gy-5);ctx.closePath();ctx.fill();}
    }
  }
}
