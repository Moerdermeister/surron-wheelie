const screens=['scrTitle','scrShop','scrSet','scrOver'];
function showScreen(id){screens.forEach(s=>el(s).classList.toggle('hide',s!==id));}
function refreshTitle(){el('tBest').textContent=save.best;el('tCoins').textContent=Math.floor(save.coins);el('tBikes').textContent=save.owned.length+'/'+BIKES.length;}
const CTRLS=[['→ / D','Gas'],['← / A','Bremsen'],['↑ / W','Lean / Backflip'],['↓ / S','Nick / Frontflip'],['E / Q','Gang +/−'],['SHIFT','Aufstehen'],['LEER','Sprung'],['F','Nitro']];
function buildControls(){const g=el('ctrlGrid');g.innerHTML='';CTRLS.forEach(([k,d])=>{const e=document.createElement('div');e.className='ctrl';e.innerHTML='<kbd>'+k+'</kbd><span class="d">'+d+'</span>';g.appendChild(e);});}
function bikeMiniCanvas(canvas,b){const x=canvas.getContext('2d');canvas.width=canvas.clientWidth*2;canvas.height=236;const w=canvas.width,h=canvas.height;x.clearRect(0,0,w,h);
  x.save();x.translate(w*0.5,h*0.60);x.scale(1.95,1.95);const fake={def:b,wheelSpin:0.3,tilt:0.12,crashed:false,onGround:true,rotAccum:0,airStartStand:false,noHand:0};
  x.rotate(-fake.tilt);drawBikeArt(x,fake);x.restore();}
function buildShop(){el('shopCoins').textContent=Math.floor(save.coins);const grid=el('bikeGrid');grid.innerHTML='';
  BIKES.forEach(b=>{const owned=save.owned.includes(b.id),sel=save.selected===b.id,afford=save.coins>=b.price;
    const card=document.createElement('div');card.className='card'+(sel?' sel':'');
    const tag=sel?'<span class="tag equip">Aktiv</span>':(owned?'<span class="tag owned">Im Besitz</span>':'');
    const bars=[['Speed',b.stats.speed],['Beschl.',b.stats.accel],['Wheelie',b.stats.pop],['Grip',b.stats.grip]]
      .map(([l,v])=>'<div class="bar"><span class="bl">'+l+'</span><div class="bt"><div class="bf" style="width:'+Math.round(v*100)+'%"></div></div></div>').join('');
    let foot;
    if(sel)foot='<span class="price free">Ausgerüstet</span><button class="cbtn" disabled style="opacity:.4">Aktiv</button>';
    else if(owned)foot='<span class="price free">Im Besitz</span><button class="cbtn equip" data-equip="'+b.id+'">Auswählen</button>';
    else foot='<span class="price">'+(b.price===0?'<span class="c">Gratis</span>':'<span class="c">'+b.price.toLocaleString('de-CH')+'</span> ⛁')+'</span><button class="cbtn buy'+(afford?'':' locked')+'" data-buy="'+b.id+'">'+(afford?'Kaufen':'Zu teuer')+'</button>';
    card.innerHTML=tag+'<canvas></canvas><h3>'+b.name+' <span style="color:var(--mut);font-size:13px">'+(b.sub||'')+'</span></h3><div class="blurb">'+b.blurb+'</div><div class="bars">'+bars+'</div><div class="foot">'+foot+'</div>';
    grid.appendChild(card);requestAnimationFrame(()=>bikeMiniCanvas(card.querySelector('canvas'),b));});}
function toast(m,k){const t=el('toast');t.textContent=m;t.className='toast show '+(k||'');setTimeout(()=>t.classList.remove('show'),1600);}

el('bikeGrid').addEventListener('click',e=>{const buy=e.target.closest('[data-buy]'),eq=e.target.closest('[data-equip]');
  if(buy){const b=bikeById(buy.dataset.buy);if(save.owned.includes(b.id))return;
    if(save.coins>=b.price){save.coins-=b.price;save.owned.push(b.id);save.selected=b.id;persist();toast('Gekauft & ausgerüstet: '+b.name,'good');buildShop();refreshTitle();}
    else toast('Nicht genug Coins für '+b.name,'bad');}
  else if(eq){save.selected=eq.dataset.equip;persist();toast('Ausgerüstet: '+bikeById(save.selected).name,'good');buildShop();}});

function setRow(label,sub,controlHTML){return '<div class="set-row"><div><div class="lbl">'+label+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+controlHTML+'</div>';}
function segHTML(id,opts,cur){return '<div class="seg" data-seg="'+id+'">'+opts.map(o=>'<button data-v="'+o[0]+'" class="'+(o[0]===cur?'on':'')+'">'+o[1]+'</button>').join('')+'</div>';}
function tglHTML(id,on){return '<div class="toggle '+(on?'on':'')+'" data-tgl="'+id+'"></div>';}
function buildSettings(){
  const s=save.settings;
  el('setMain').innerHTML=
    setRow('Preset','Setzt alle Effekte auf einmal',segHTML('preset',[['low','Low'],['med','Med'],['high','High']],s.quality))+
    setRow('Hindernisse','Autos, Container &amp; Hütchen ein/aus','<div class="toggle '+(s.obstacles?'on':'')+'" data-tgl="obstacles"></div>')+
    setRow('Hügel / Rampen','Bodenwellen &amp; Sprungrampen auf der Strecke','<div class="toggle '+(s.hills?'on':'')+'" data-tgl="hills"></div>')+
    setRow('Kamera-Zoom','Näher = grösser, weiter = mehr Übersicht',segHTML('zoom',[['far','Weit'],['mid','Mittel'],['near','Nah']],s.zoom))+
    setRow('Sound','Motor, Sirene, Effekte',tglHTML('sound',s.sound))+
    setRow('Touch-Steuerung','Bildschirm-Buttons erzwingen',tglHTML('touch',s.forceTouch));
  el('setFx').innerHTML=FX_ORDER.map(k=>setRow(FX_LABELS[k],'',tglHTML('fx_'+k,s.fx[k]))).join('');
}
function settingsClick(e){
  const segBtn=e.target.closest('[data-seg] button');const tgl=e.target.closest('[data-tgl]');
  if(segBtn){const seg=segBtn.parentElement.dataset.seg;const v=segBtn.dataset.v;
    if(seg==='preset')applyPreset(v);else if(seg==='zoom')save.settings.zoom=v;
    persist();buildSettings();return;}
  if(tgl){const id=tgl.dataset.tgl;
    if(id==='obstacles')save.settings.obstacles=!save.settings.obstacles;
    else if(id==='hills'){save.settings.hills=!save.settings.hills;if(!save.settings.hills&&state===ST.PLAY)ramps=[];}
    else if(id==='sound'){save.settings.sound=!save.settings.sound;
      if(save.settings.sound){audioInit();if(Audio_.on){try{Audio_.master.gain.value=.5;}catch(_){}}}
      else if(Audio_.on){try{Audio_.master.gain.value=0;}catch(_){}}}
    else if(id==='touch'){save.settings.forceTouch=!save.settings.forceTouch;el('touch').classList.toggle('on',state===ST.PLAY&&showTouch());}
    else if(id.indexOf('fx_')===0){const key=id.slice(3);save.settings.fx[key]=!save.settings.fx[key];save.settings.quality='custom';applyQuality();}
    persist();buildSettings();}
}
el('scrSet').addEventListener('click',settingsClick);

el('btnFree').onclick=()=>startRun('free');
el('btnPolice').onclick=()=>startRun('police');
el('btnShop').onclick=()=>{buildShop();showScreen('scrShop');};
el('btnSettings').onclick=()=>{buildSettings();showScreen('scrSet');};
el('btnSetBack').onclick=()=>{refreshTitle();showScreen('scrTitle');};
el('btnShopBack').onclick=()=>{refreshTitle();showScreen('scrTitle');};
el('btnRetry').onclick=()=>startRun(run?run.mode:'free');
el('btnOverShop').onclick=()=>{buildShop();showScreen('scrShop');};
el('btnOverMenu').onclick=()=>{refreshTitle();showScreen('scrTitle');};
el('btnMenu').onclick=()=>endRun(false);

/* ============================ INPUT ============================ */
const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
function showTouch(){return save.settings.forceTouch||isTouch;}
const KMAP={'arrowright':'throttle','d':'throttle','arrowleft':'brake','a':'brake','arrowup':'leanBack','w':'leanBack','arrowdown':'leanFwd','s':'leanFwd',' ':'jump','shift':'stand','f':'nitro'};
window.addEventListener('keydown',e=>{audioInit();const k=e.key.toLowerCase();
  if(k==='enter'&&state===ST.PLAY){endRun(false);return;}
  if(state===ST.PLAY&&(k==='e'||k===']')){shiftGear(1);return;}
  if(state===ST.PLAY&&(k==='q'||k==='[')){shiftGear(-1);return;}
  if(KMAP[k]!==undefined){keys[KMAP[k]]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
    if(k===' '&&state===ST.PLAY&&bike&&bike.onGround&&!bike.crashed){bike.vy=-bike.p.jump;bike.onGround=false;bike.rearDown=false;bike.frontDown=false;sfxJump();}}});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KMAP[k]!==undefined)keys[KMAP[k]]=false;});

/* ---- Admin-Code 14005: schaltet alles frei ---- */
function unlockAll(){save.owned=BIKES.map(b=>b.id);save.coins=Math.max(save.coins,0)+100000;persist();refreshTitle();
  if(!el('scrShop').classList.contains('hide'))buildShop();if(!el('scrTitle').classList.contains('hide'))refreshTitle();
  toast('🔓 ADMIN: Alle Bikes + 100k Coins!','good');}
let codeBuf='';
window.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){codeBuf=(codeBuf+e.key).slice(-6);if(codeBuf.indexOf('14005')>=0){codeBuf='';unlockAll();}}});
(function(){let n=0,t=0;const tl=document.querySelector('#scrTitle .bigtitle');if(tl){tl.addEventListener('click',()=>{const now=Date.now();if(now-t>1500)n=0;t=now;n++;
  if(n>=3){n=0;const code=window.prompt('Admin-Code:');if(code&&code.trim()==='14005')unlockAll();else if(code)toast('Falscher Code','bad');}});}})();

document.querySelectorAll('#touch .tbtn').forEach(btn=>{
  const act=btn.dataset.act;
  if(act){const fire=ev=>{ev.preventDefault();audioInit();btn.classList.add('act');if(act==='gearup')shiftGear(1);else if(act==='geardn')shiftGear(-1);};
    const rel=ev=>{ev.preventDefault();btn.classList.remove('act');};
    btn.addEventListener('touchstart',fire,{passive:false});btn.addEventListener('touchend',rel,{passive:false});
    btn.addEventListener('mousedown',fire);btn.addEventListener('mouseup',rel);btn.addEventListener('mouseleave',rel);return;}
  const k=btn.dataset.k;
  const on=ev=>{ev.preventDefault();audioInit();keys[k]=true;btn.classList.add('act');
    if(k==='jump'&&state===ST.PLAY&&bike&&bike.onGround&&!bike.crashed){bike.vy=-bike.p.jump;bike.onGround=false;bike.rearDown=false;bike.frontDown=false;sfxJump();}};
  const off=ev=>{ev.preventDefault();keys[k]=false;btn.classList.remove('act');};
  btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off,{passive:false});btn.addEventListener('touchcancel',off,{passive:false});
  btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);});

function checkRotate(){const small=Math.min(W,H)<520;const portrait=H>W;const inGame=el('calc')&&el('calc').classList.contains('hide');el('rotate').classList.toggle('on',inGame&&isTouch&&small&&portrait);}

/* ============================ AMBIENT MENU SCENE ============================ */
let ambCursor=0;
function spawnAheadAmbient(){const horizon=bike.cx+W/cam.zoom+200;while(ambCursor<horizon){if(Math.random()<.4)ramps.push({x:ambCursor,w:rnd(54,80),h:rnd(38,66)});ambCursor+=rnd(700,1100);}ramps=ramps.filter(o=>o.x>bike.cx-700);}
function ambient(now){requestAnimationFrame(ambient);if(state===ST.PLAY||!bike)return;now0=now;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  bike.cx+=1.8;bike.wheelSpin+=0.1;bike.cy=groundY(bike.cx)-AX-R;bike.tilt+=((slopeAt(bike.cx))-bike.tilt)*0.1;bike.onGround=true;bike.rearDown=true;bike.frontDown=true;
  cam.x=lerp(cam.x,bike.cx,0.05);cam.y=lerp(cam.y,STREET_Y,0.05);cam.zoom=lerp(cam.zoom,zoomVal(),0.05);
  spawnAheadAmbient();
  drawSky(false);drawClouds(false);drawSkyline(false);drawMidCity(false);drawBgTraffic(false);
  ctx.save();ctx.translate(W*cam.anchorX,H*cam.anchorY);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.x,-cam.y);
  drawStreet(false);drawBikeWorld(bike);ctx.restore();drawForeground(false);}
requestAnimationFrame(ambient);

/* ============================ CALCULATOR DECOY + EMERGENCY ============================ */
const calc={cur:'0',stored:null,op:null,fresh:true};
function calcRender(){el('calcOut').textContent=calc.cur;el('calcExpr').textContent=(calc.stored!=null?(calc.stored+' '+(calc.op||'')):'');}
function calcReset(){calc.cur='0';calc.stored=null;calc.op=null;calc.fresh=true;calcRender();}
function calcDigit(d){if(calc.cur.length>14)return;if(calc.fresh||calc.cur==='0'){calc.cur=(d==='.'?'0.':d);calc.fresh=false;}else{if(d==='.'&&calc.cur.indexOf('.')>=0)return;calc.cur+=d;}calcRender();}
function calcCompute(a,op,b){a=parseFloat(a);b=parseFloat(b);let r;switch(op){case'×':r=a*b;break;case'÷':r=(b===0?NaN:a/b);break;case'+':r=a+b;break;case'−':r=a-b;break;default:r=b;}
  if(!isFinite(r))return'Error';return String(Math.round(r*1e9)/1e9);}
function calcOp(op){if(calc.op&&!calc.fresh){calc.cur=calcCompute(calc.stored,calc.op,calc.cur);}calc.stored=calc.cur;calc.op=op;calc.fresh=true;calcRender();}
function calcEquals(){
  // Geheim-Code: 100 × 125 = startet das Spiel
  if(calc.stored==='100'&&calc.op==='×'&&calc.cur==='125'){launchFromCalc();return;}
  if(calc.op==null||calc.stored==null)return;
  calc.cur=calcCompute(calc.stored,calc.op,calc.cur);calc.stored=null;calc.op=null;calc.fresh=true;calcRender();
}
function calcKey(c){
  if(/^[0-9.]$/.test(c))calcDigit(c);
  else if(c==='AC')calcReset();
  else if(c==='back'){calc.cur=calc.cur.length>1?calc.cur.slice(0,-1):'0';calcRender();}
  else if(c==='%'){calc.cur=String(parseFloat(calc.cur)/100);calc.fresh=true;calcRender();}
  else if(c==='='){calcEquals();}
  else if('×÷+−'.indexOf(c)>=0)calcOp(c);
}
document.querySelectorAll('#calc .ck').forEach(b=>b.addEventListener('click',()=>calcKey(b.dataset.c)));
window.addEventListener('keydown',e=>{
  if(el('calc').classList.contains('hide'))return;
  const k=e.key;let c=null;
  if(/^[0-9.]$/.test(k))c=k;
  else if(k==='*'||k==='x'||k==='X')c='×';else if(k==='/')c='÷';else if(k==='+')c='+';else if(k==='-')c='−';
  else if(k==='Enter'||k==='=')c='=';else if(k==='Backspace')c='back';else if(k==='Escape')c='AC';
  if(c!==null){e.preventDefault();calcKey(c);}
});
function launchFromCalc(){el('calc').classList.add('hide');el('emg').classList.remove('hide');refreshTitle();showScreen('scrTitle');checkRotate();}
function openCalc(){calcReset();el('calc').classList.remove('hide');el('emg').classList.add('hide');checkRotate();}
function emergencyExit(){
  state=ST.MENU;el('hud').classList.add('hide');el('touch').classList.remove('on');
  if(Audio_.on){try{Audio_.engGain.gain.value=0;Audio_.whineGain.gain.value=0;Audio_.sirenGain.gain.value=0;}catch(_){}}
  showScreen('scrTitle');openCalc();
  try{window.open('https://schabi.ch/dashboard','_blank','noopener');}catch(_){}
}
el('emg').addEventListener('click',emergencyExit);
(async function(){resize();await loadSave();applyQuality();buildControls();refreshTitle();newBike();ambCursor=bike.cx+700;showScreen('scrTitle');checkRotate();})();
})();
</script>
